[project]
name = "edge-ids"
version = "0.1.0"
description = "Edge-optimized IoT intrusion detection via knowledge distillation and model compression"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
    "joblib",
    "tqdm",
    "requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_ids"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
